<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda de actividades</title>
  <link rel="stylesheet" href="styles/styles.css">
  <script src="javascript/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <img class="site-logo" src="imgs/logo.jpg" alt="Logo de Agenda de actividades">
    <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Modo oscuro</button>
    <p class="eyebrow">ORGANIZA TU DÍA</p>
    <h1>Agenda de actividades</h1>
    <p class="intro">Jose Israel Olvera Bucio</p>
  </header>

  <main class="page-layout">
    <section class="form-panel" aria-labelledby="form-title">
      <p class="eyebrow">UN PASO A LA VEZ</p>
      <h2 id="form-title">Nueva actividad</h2>
      <p class="muted">Agrega un plan y aparecerá en tu lista.</p>
      <form id="activity-form" novalidate>
        <label for="activity-title">Actividad</label>
        <input id="activity-title" name="title" type="text" placeholder="Ej. Regar las plantas">
        <label for="activity-date">Fecha</label>
        <input id="activity-date" name="date" type="date">
        <label for="activity-category">Categoría</label>
        <select id="activity-category" name="category">
          <option value="">Elige una categoría</option>
          <option value="Personal">Personal</option>
          <option value="Trabajo">Trabajo</option>
          <option value="Estudio">Estudio</option>
          <option value="Bienestar">Bienestar</option>
        </select>
        <p id="activity-preview" class="activity-preview" hidden aria-live="polite"></p>
        <p id="form-error" class="field-error" aria-live="polite"></p>
        <button class="button button-primary" id="btn-add" type="submit">Agregar actividad</button>
        <button class="button button-quiet" id="btn-reset" type="button">Limpiar campos</button>
      </form>
    </section>

    <section class="list-panel" aria-labelledby="list-title">
      <div class="list-heading">
        <div>
          <p class="eyebrow">TUS PLANES</p>
          <h2 id="list-title">Actividades</h2>
        </div>
        <p id="activity-count" class="count">0 actividades</p>
      </div>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      <p id="empty-message" class="empty-message">Tu lista está despejada.<br>Agrega una actividad para empezar.</p>
      <ul id="activity-list" class="activity-list"></ul>
    </section>
  </main>

  <footer><p>Hecho para organizar.</p></footer>
</body>
</html>
